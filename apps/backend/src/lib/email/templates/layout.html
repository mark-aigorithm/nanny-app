<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>NannyApp</title>
    <!-- Manrope where clients honour web fonts; the inline stack covers the rest. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #fdfaf8;
      }
      table {
        border-collapse: collapse;
      }
    </style>
  </head>
  <body
    style="margin:0; padding:0; background-color:#fdfaf8; font-family:'Manrope',-apple-system,'Segoe UI',Arial,sans-serif; color:#444842;"
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#fdfaf8;">
      <tr>
        <td align="center" style="padding:24px 12px;">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px; max-width:600px;">
            <!-- Header -->
            <tr>
              <td style="background-color:#97a591; border-radius:16px 16px 0 0; padding:24px 32px; text-align:center;">
                <span
                  style="font-family:'Manrope',-apple-system,'Segoe UI',Arial,sans-serif; font-size:22px; font-weight:800; letter-spacing:-0.5px; color:#ffffff;"
                  >NannyApp</span
                >
              </td>
            </tr>
            <!-- Body card -->
            <tr>
              <td style="background-color:#ffffff; padding:32px; border-left:1px solid #ebddd2; border-right:1px solid #ebddd2;">
                {{{body}}}
              </td>
            </tr>
            <!-- Footer -->
            <tr>
              <td
                style="background-color:#ffffff; border-radius:0 0 16px 16px; border-left:1px solid #ebddd2; border-right:1px solid #ebddd2; border-bottom:1px solid #ebddd2; padding:24px 32px; text-align:center;"
              >
                <p style="margin:0; font-size:12px; line-height:18px; color:#7a7a7a;">
                  This is an automated receipt from NannyApp. Please keep it for your records.
                </p>
                <p style="margin:8px 0 0; font-size:12px; line-height:18px; color:#7a7a7a;">© NannyApp</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

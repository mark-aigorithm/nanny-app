# C2 — a mother signs up from scratch, all the way to her home screen.
#
# The wizard proves her phone first, so every later step runs signed in:
#
#   1/5 Your number            — /auth/availability, then the SMS (emulator)
#   2/5 About you              — photo, names, email, DOB; the photo uploads here
#   3/5 Secure your account    — our email OTP (read out of Mailpit), then the
#                                password, linked onto the phone account
#   4/5 Location & preferences — the map pin and the street line
#   5/5 Finish                 — referral (C7), the Terms link, Complete setup
#
# What makes it drivable:
#   - the photo picker is short-circuited to a bundled placeholder under E2E
#     (lib/e2eImage), so the photo gate opens without touching system UI;
#   - the location step needs coordinates: run.mjs gives the device a Cairo geo
#     fix, the map card centres on it, and tapping the map sets the pin;
#   - the account is created from scratch, so the seeder WIPES it (Firebase user
#     + DB row + dependents) before every run rather than upserting it, or the
#     second run collides on its unique phone (Phase 2c).
#
# Reaching the home screen at the end is the proof the whole chain landed —
# phone verify, email verify, email/password link, POST /auth/register and
# the referral redeem.
appId: com.nannyapp.mobile
---
- runFlow: _launch.yaml

- tapOn: 'Sign up'
- extendedWaitUntil:
    visible: 'Create your account'
    timeout: 30000

# Nothing chosen yet: the button is disabled and the screen says why.
- assertVisible: 'Select an option above to sign up'
- tapOn: "I'm a mother"
# The button takes the name of the choice — the only readable confirmation the
# radio registered.
- assertVisible: 'Sign up as a mother'
- tapOn: 'Sign up as a mother'

# ── Step 1 of 5 — your number ──────────────────────────────────────────────
- extendedWaitUntil:
    visible: 'STEP 1 OF 5 — YOUR NUMBER'
    timeout: 30000
- tapOn: '100 000 0000'
- inputText: ${REGISTRATION_PHONE}
- hideKeyboard
- tapOn: 'Send code'
# The resend timer appearing is the signal the code went, so the emulator has
# one to hand back before we read it.
- extendedWaitUntil:
    visible: 'Resend in.*'
    timeout: 30000
- runScript:
    file: ../scripts/advance.js
    env:
      ADVANCE: phone-otp
      OTP_PHONE: ${REGISTRATION_PHONE_E164}
- assertTrue: ${output.otp != null}
- tapOn:
    id: 'registerPhone.code.boxes'
- inputText: ${output.otp}
- hideKeyboard
- tapOn: 'Verify'

# ── Step 2 of 5 — about you ────────────────────────────────────────────────
- extendedWaitUntil:
    visible: 'STEP 2 OF 5 — ABOUT YOU'
    timeout: 30000

# Every missing field says so under itself on the first Continue; a photo then
# clears its own. Under E2E the picker returns a bundled placeholder, so "Add
# photo" becomes "Change photo" without any system UI.
- assertNotVisible: 'A profile photo is required.'
- tapOn: 'Continue'
- assertVisible: 'A profile photo is required.'
- assertVisible: 'Please enter your first name.'
- tapOn: 'Add photo'
- extendedWaitUntil:
    visible: 'Change photo'
    timeout: 30000
- assertNotVisible: 'A profile photo is required.'

# hideKeyboard between each field: the keyboard covers the lower half, and a
# tap on a field behind it lands on a key instead.
- tapOn: 'Enter your first name'
- inputText: ${REGISTRATION_FIRST_NAME}
- hideKeyboard
- tapOn: 'Enter your last name'
- inputText: 'Lab'
- hideKeyboard
# A real address, verified on the next screen — this is what lands in
# `users.email` and becomes her Firebase sign-in credential.
- tapOn: 'you@example.com'
- inputText: ${REGISTRATION_EMAIL}
- hideKeyboard

# Date of birth opens the native Android date dialog. Its default is 25 years
# ago — a valid adult DOB — so accepting it with OK is all this needs.
- scrollUntilVisible:
    element:
      text: 'Select your date of birth'
    direction: DOWN
    timeout: 20000
- tapOn: 'Select your date of birth'
- tapOn: 'OK'
# Continue also uploads the photo, now that she is signed in.
- tapOn: 'Continue'

# ── Step 3 of 5 — secure your account (email OTP, then the password) ───────
- extendedWaitUntil:
    visible: 'STEP 3 OF 5 — SECURE YOUR ACCOUNT'
    timeout: 60000
# The code is sent as the screen opens; the resend timer appearing is the signal
# it went, so there is a message in the inbox before the advance step reads it.
- extendedWaitUntil:
    visible: 'Resend in.*'
    timeout: 30000
- runScript:
    file: ../scripts/advance.js
    env:
      ADVANCE: email-otp
      EMAIL_OTP_ADDRESS: ${REGISTRATION_EMAIL}
- assertTrue: ${output.emailOtp != null}
- tapOn:
    id: 'registerAccount.code.boxes'
- inputText: ${output.emailOtp}
# No hideKeyboard here: the sixth digit starts the check, which disables and
# then replaces the code input, closing the keyboard itself. On Android
# Maestro's hideKeyboard with no keyboard up is a Back press, which pops
# this step back to About you.
# Six digits check themselves; the password fields appear once they pass.
- extendedWaitUntil:
    visible: 'Enter a password'
    timeout: 30000
- tapOn: 'Enter a password'
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: 'Re-enter your password'
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: 'Continue'

# ── Step 4 of 5 — location & preferences ───────────────────────────────────
- extendedWaitUntil:
    visible: 'STEP 4 OF 5 — LOCATION & PREFERENCES'
    timeout: 30000
# This lab's build has a Maps key, so the map renders (centred on the device's
# Cairo geo fix). Tapping the map fires its onPress with that point's
# coordinate and sets the pin synchronously, which is the lat/long Continue
# requires — no reliance on the async GPS read landing in time.
- tapOn:
    point: '50%,44%'
# The street line is required for every account. After the map tap, so a
# reverse-geocoded line can't overwrite it afterwards.
- tapOn: 'Street address'
- inputText: '1 Test Street, Cairo'
- hideKeyboard
# A preference, for coverage — optional (nothing is pre-ticked), so it does
# not gate Continue.
- tapOn: 'Background checked'
- tapOn: 'Continue'

# ── Step 5 of 5 — finish: referral (C7), terms ─────────────────────────────
- extendedWaitUntil:
    visible: 'STEP 5 OF 5 — FINISH'
    timeout: 30000
- assertVisible: 'Signed in as ${REGISTRATION_PHONE_E164}'

# ── C7: the referral field, validated live ─────────────────────────────────
# The existing mother's own code (read over HTTP); the field calls the
# optional-auth validate endpoint and confirms it before the account exists.
# She is signed in to Firebase here but has no users row yet, so this is the
# assertion that catches the endpoint demanding one. Match the referrer's name
# (Mona, accounts.mjs) — the field's permanent hint also starts "Invited by",
# so a bare 'Invited by.*' passes even when validation fails.
- runScript:
    file: ../scripts/advance.js
    env:
      ADVANCE: referrer-code
- tapOn: 'SARAH-4K2P'
- inputText: ${output.referrerCode}
- hideKeyboard
- extendedWaitUntil:
    visible: 'Invited by Mona .*'
    timeout: 30000

# The Terms open from the admin-managed text (the placeholder, in a fresh
# stack), from their own link under the terms card.
- tapOn: 'Terms of Service'
- extendedWaitUntil:
    visible: '.*will be published here soon.*'
    timeout: 30000
- back
- extendedWaitUntil:
    visible: 'STEP 5 OF 5 — FINISH'
    timeout: 30000

# Accept the terms; the whole card toggles the box.
- tapOn: 'I agree to the Terms of Service and Privacy Policy'
- tapOn: 'Complete setup'

# The notification-permission screen stands between the last step and home.
- extendedWaitUntil:
    visible: 'Stay in the loop'
    timeout: 60000
- tapOn: 'Not now'

# Registered and signed in — the mother's home.
- extendedWaitUntil:
    visible: 'Book care'
    timeout: 60000

# A11 — a mother's ID gates booking.
#
# Unlike the nanny gate, this one does not lock her out of the app: she browses
# freely and is stopped at the moment she tries to book, which is the only place
# the rule exists on screen. Both halves are asserted here — the modal that
# stops her, and the request that goes through once an operator has verified her.
#
# This starts from a seeded mother who has never uploaded an ID — exactly where
# registration leaves her — and drives the real upload: the gate modal captures
# the ID inline (IdUploadModal → IdCaptureFields), and the picker is
# short-circuited to a bundled placeholder under E2E, so "Submit for review"
# sends a real document to the review queue that the operator then approves.
appId: com.nannyapp.mobile
---
- runFlow: _launch.yaml

- runFlow:
    file: _sign-in.yaml
    env:
      PHONE: ${GATED_MOTHER_PHONE}

# ── Stopped ────────────────────────────────────────────────────────────────
# She reaches her home screen like anyone else. The gate is on the action, not
# on the app.
- extendedWaitUntil:
    visible: 'Book care'
    timeout: 60000
- tapOn: 'Book care'

- extendedWaitUntil:
    visible: 'Verify your identity'
    timeout: 30000
- assertNotVisible: 'Pick a day'

# ── Uploads her ID ─────────────────────────────────────────────────────────
# A passport (front only); the placeholder stands in for the photo, and the
# card flips to "Change" once it is set. Submit sends it to the review queue.
- tapOn: 'Passport'
- tapOn: 'Passport photo page'
- extendedWaitUntil:
    visible: 'Change'
    timeout: 30000
- tapOn: 'Submit for review'
# Submit closes the gate, so this is also the proof the upload was accepted.
- extendedWaitUntil:
    visible: 'Book care'
    timeout: 30000
- assertNotVisible: 'Verify your identity'

# ── Verified ───────────────────────────────────────────────────────────────
# She is now PENDING_REVIEW, in the operator's queue; approving moves her to
# APPROVED, which is what the next open lets her book on.
- runScript:
    file: ../scripts/advance.js
    env:
      ADVANCE: admin-approve-mother
- assertTrue: ${output.status == 'APPROVED'}

# Her profile is read once at startup and cached, so the app only learns of the
# decision on the next open — see _relaunch.yaml.
- runFlow:
    file: _relaunch.yaml
    env:
      EXPECT: 'Book care'

# Straight through this time, and all the way to a real request — so this
# asserts the server agrees with the app about her, not just that a modal
# stopped appearing.
- runFlow: _book-to-review.yaml
- assertNotVisible: 'Verify your identity'
- tapOn:
    id: 'booking.cta'

- extendedWaitUntil:
    visible: 'Finding a nanny'
    timeout: 30000

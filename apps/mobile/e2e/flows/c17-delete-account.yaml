# C17 — Delete account.
#
# The Account tab's "Delete account" (`MotherProfileWalletScreen`, behind
# `useConfirmDeleteAccount`) asks a themed confirm dialog, then
# `useDeleteAccount`: DELETE /auth/me with the explicit
# `{ confirm: 'delete-my-account' }` body real deletion requires. The backend
# scrambles the row's email/phone/uid (`scrambleIdentity`,
# account-deletion.service.ts) and hard-deletes the Firebase user; the app
# clears its local session, lands back on the sign-in screen, and shows a
# one-button notice on top of it.
#
# The confirm and notice dialogs are both `ConfirmDialogHost` — a Modal, which
# on Android drops everything behind it out of the accessibility tree. So each
# dialog is waited for and dismissed *before* asserting on what is underneath,
# never alongside it.
#
# The DELETABLE account is seeded fresh every run (accounts.mjs): deleting it
# scrambles away the very email/phone the next run's seeder would upsert by,
# so — unlike a registration throwaway — nothing has to explicitly wipe it.
appId: com.nannyapp.mobile
---
- runFlow: _launch.yaml

- runFlow:
    file: _sign-in.yaml
    env:
      EMAIL: ${DELETABLE_EMAIL}
- extendedWaitUntil:
    visible: 'Book care'
    timeout: 60000

# ── Account tab → Delete account → confirm ──────────────────────────────────
- tapOn: 'Account'
- extendedWaitUntil:
    visible: 'Delete account'
    timeout: 30000
- tapOn: 'Delete account'

- extendedWaitUntil:
    visible: 'Delete your account\?'
    timeout: 10000
- assertVisible: "This deletes your profile and signs you out. It can't be undone."
- tapOn: 'Delete account'

# ── The notice sits on the sign-in screen underneath, but the modal hides it
#    from Maestro until this is dismissed ───────────────────────────────────
- extendedWaitUntil:
    visible: 'Account deleted'
    timeout: 30000
- assertVisible: 'Your account has been deleted.'
- tapOn: 'Got it'
- extendedWaitUntil:
    visible: 'Welcome to NannyNow'
    timeout: 30000

# ── Same number now finds no account: the phone-only Firebase user Firebase
#    mints while checking the code is discarded, and the number is free ────
- tapOn:
    id: 'signIn.phone'
- inputText: ${DELETABLE_PHONE}
- hideKeyboard
- tapOn: 'Send code'
- extendedWaitUntil:
    visible: "Didn't get a code?"
    timeout: 60000
- runScript:
    file: ../scripts/advance.js
    env:
      ADVANCE: phone-otp
      OTP_PHONE: ${DELETABLE_PHONE_E164}
- assertTrue: ${output.otp != null}
- tapOn:
    id: 'signIn.code.boxes'
- inputText: ${output.otp}
- hideKeyboard
- tapOn: 'Sign in'
- extendedWaitUntil:
    visible: "We couldn't find an account for that number. Sign up first."
    timeout: 30000

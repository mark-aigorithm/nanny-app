# Reopens the app without clearing anything, the way a parent returns to it
# after the shift has moved on without her, and waits for ${EXPECT}.
#
# Not a test — the leading underscore keeps run.mjs from treating it as one.
#
# Why any flow needs this: React Query holds every response for sixty seconds
# (`staleTime` in src/lib/queryClient.ts), so a screen already showing a booking
# will not notice the same booking being checked into, logged against or checked
# out of by the nanny. Reopening the app is the one thing that reliably empties
# that cache — it lives in memory only.
#
# The session survives, so this lands straight on the mother's home screen. The
# developer menu does not reappear either: dev-client only shows it on the first
# launch after a state clear, which is `_launch.yaml`'s job, not this one.
#
# Wrapped in a retry, and that is the reason ${EXPECT} is a parameter rather
# than something the caller asserts afterwards: the VIEW intent occasionally
# does not start the app at all — the device is left on its own home screen and
# nothing appears in logcat for two minutes. Without something to check against,
# the retry would have no way to tell a lost intent from a slow launch.
appId: com.nannyapp.mobile
---
- retry:
    maxRetries: 2
    commands:
      - stopApp
      - openLink: 'nanny-app://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081'
      - extendedWaitUntil:
          visible: ${EXPECT}
          timeout: 90000

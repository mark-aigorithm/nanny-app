# C10 — what the app says when there is nothing to show, and when it cannot ask.
#
# Two of the three states in the catalogue are driven here.
#
# **Nothing to show** is asserted on the mother's own bookings, because the
# seeder soft-deletes every booking a previous run left behind — so an empty
# list is a fact about this run rather than a coincidence, which is not true of
# any other list in this database.
#
# **Cannot ask** is real: the device goes into airplane mode, so nothing it
# asks can arrive. Stubbing the client would test the stub. Since OfflineGate
# (components/OfflineGate.tsx) the app answers that at the root: the moment the
# device reports no connection, one full-screen "You're offline" covers
# whatever she was on. What matters is both halves — that it says so in words
# a person can act on, and that it gets out of the way when the network comes
# back, revealing the screen she left rather than a reset app. A failure state
# that never recovers is the more common bug of the two.
#
# The Refer-a-friend screen's own error line ("Couldn’t load your invites") is
# for a request that fails while the device still believes it is online — the
# gate never sees that, and airplane mode cannot produce it reliably, so it is
# covered by ReferAFriendScreen.test.tsx instead of here.
#
# ── Not covered here: a token expiring mid-session ─────────────────────────
# A Firebase ID token is good for an hour and `getIdToken()` refreshes it
# transparently, so nothing inside a flow's lifetime can expire one. Forcing it
# means disabling the lab account in the Auth emulator, which every other flow
# then signs in as. The 401 path is asserted where it can be: the backend's own
# integration tests reject tampered and stale tokens directly.
appId: com.nannyapp.mobile
# Runs even when a step fails: a device left in airplane mode fails every flow
# after this one on "You're offline".
onFlowComplete:
  - setAirplaneMode: disabled
---
- runFlow: _launch.yaml

- runFlow:
    file: _sign-in.yaml
    env:
      EMAIL: ${MOTHER_EMAIL}
- extendedWaitUntil:
    visible: 'Book care'
    timeout: 60000

# ── Nothing to show ────────────────────────────────────────────────────────
# An empty state rather than a spinner that never resolves, and one that names
# the tab it is empty for.
- tapOn: 'Activity'
- extendedWaitUntil:
    visible: 'No upcoming bookings'
    timeout: 30000

# ── Cannot ask ─────────────────────────────────────────────────────────────
# A real screen to leave behind first, opened while online, so the recovery
# below can prove she comes back to it.
- tapOn: 'Account'
- extendedWaitUntil:
    visible: 'Refer a friend'
    timeout: 30000
- tapOn: 'Refer a friend'
- extendedWaitUntil:
    visible: 'Your code'
    timeout: 30000

- setAirplaneMode: enabled

# One clear state, not a spinner: the gate covers the app as soon as the OS
# reports the connection gone.
- extendedWaitUntil:
    visible: "You're offline"
    timeout: 60000
- assertVisible: 'Try again'

# "Try again" really re-checks rather than waving her through: still offline,
# so the gate stays, and the button comes back for another go.
- tapOn: 'Try again'
- extendedWaitUntil:
    visible: 'Try again'
    timeout: 15000
- assertVisible: "You're offline"

# ── And back again ─────────────────────────────────────────────────────────
- setAirplaneMode: disabled

# The gate follows the OS back online by itself. The radio takes a few seconds
# to reassociate, and the OS's change event can lag it, so each round first
# waits, then uses the gate's own "Try again" — the recovery it offers her.
- retry:
    maxRetries: 4
    commands:
      - runFlow:
          when:
            visible: "You're offline"
          commands:
            - extendedWaitUntil:
                notVisible: "You're offline"
                timeout: 15000
                optional: true
            - runFlow:
                when:
                  visible: 'Try again'
                commands:
                  - tapOn: 'Try again'
      - extendedWaitUntil:
          notVisible: "You're offline"
          timeout: 20000

# Revealed, not reset: the screen she was on, with its data.
- assertVisible: 'Your code'
- assertVisible: 'Give an hour, get two'

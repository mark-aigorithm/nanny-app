# A10 — a nanny signs up through the forms, waits for vetting, then is approved.
#
# The old A10 started from a seeded nanny because the registration path ends at
# an ID upload that opened the Android photo picker — system UI a device flow
# could not drive. The E2E photo affordance (lib/pickImage → lib/e2eImage)
# removes that wall, so this now drives her whole seven-step wizard:
#
#   role → 1 your number (phone OTP) → 2 about you (placeholder photo, name,
#   real email, DOB) → 3 secure your account (our email OTP, read from
#   Mailpit, then the password) → 4 home location (the map, on the device geo
#   fix) → 5 professional details → 6 ID (a passport, front only, the
#   placeholder, uploaded on Continue) → 7 finish (terms) → Complete.
#
# Unlike a mother she starts PENDING_REVIEW, so Complete lands her on the vetting
# gate rather than a dashboard — which is the whole point of A10, and what the
# admin approve at the end then clears. The account is created from scratch, so
# the seeder wipes it before every run (Phase 2c); her row carries the real
# address she verified, which is why the wipe looks her up by phone and the
# approve finds her by that email.
appId: com.nannyapp.mobile
---
- runFlow: _launch.yaml

- tapOn: 'Sign up'
- extendedWaitUntil:
    visible: 'Create your account'
    timeout: 30000
- tapOn: "I'm a nanny"
- assertVisible: 'Sign up as a nanny'
- tapOn: 'Sign up as a nanny'

# ── Step 1 of 7 — your number ──────────────────────────────────────────────
- extendedWaitUntil:
    visible: 'STEP 1 OF 7 — YOUR NUMBER'
    timeout: 30000
- tapOn: '100 000 0000'
- inputText: ${REGISTRATION_NANNY_PHONE}
- hideKeyboard
- tapOn: 'Send code'
- extendedWaitUntil:
    visible: 'Resend in.*'
    timeout: 30000
- runScript:
    file: ../scripts/advance.js
    env:
      ADVANCE: phone-otp
      OTP_PHONE: ${REGISTRATION_NANNY_PHONE_E164}
- assertTrue: ${output.otp != null}
- tapOn:
    id: 'registerPhone.code.boxes'
- inputText: ${output.otp}
- hideKeyboard
- tapOn: 'Verify'

# ── Step 2 of 7 — about you ────────────────────────────────────────────────
- extendedWaitUntil:
    visible: 'STEP 2 OF 7 — ABOUT YOU'
    timeout: 30000
- assertNotVisible: 'A profile photo is required.'
- tapOn: 'Continue'
- assertVisible: 'A profile photo is required.'
- tapOn: 'Add photo'
- extendedWaitUntil:
    visible: 'Change photo'
    timeout: 30000

# hideKeyboard between stacked fields, or the keyboard covers the one below and
# the tap lands on a key instead.
- tapOn: 'Enter your first name'
- inputText: ${REGISTRATION_NANNY_FIRST_NAME}
- hideKeyboard
- tapOn: 'Enter your last name'
- inputText: 'Lab'
- hideKeyboard
# A real address — she verifies it on the next screen.
- tapOn: 'you@example.com'
- inputText: ${REGISTRATION_NANNY_EMAIL}
- hideKeyboard
- scrollUntilVisible:
    element:
      text: 'Select your date of birth'
    direction: DOWN
    timeout: 20000
- tapOn: 'Select your date of birth'
- tapOn: 'OK'
- tapOn: 'Continue'

# ── Step 3 of 7 — secure your account (email OTP, then the password) ───────
- extendedWaitUntil:
    visible: 'STEP 3 OF 7 — SECURE YOUR ACCOUNT'
    timeout: 60000
- extendedWaitUntil:
    visible: 'Resend in.*'
    timeout: 30000
- runScript:
    file: ../scripts/advance.js
    env:
      ADVANCE: email-otp
      EMAIL_OTP_ADDRESS: ${REGISTRATION_NANNY_EMAIL}
- assertTrue: ${output.emailOtp != null}
- tapOn:
    id: 'registerAccount.code.boxes'
- inputText: ${output.emailOtp}
- hideKeyboard
- extendedWaitUntil:
    visible: 'Enter a password'
    timeout: 30000
- tapOn: 'Enter a password'
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: 'Re-enter your password'
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: 'Continue'

# ── Step 4 of 7 — home location ────────────────────────────────────────────
- extendedWaitUntil:
    visible: 'STEP 4 OF 7 — HOME LOCATION'
    timeout: 30000
# The lab has no Maps key, so the pin's reverse-geocode never fills the
# address — she types it, as the wizard requires.
- tapOn: 'Street address'
- inputText: '2 Test Street, Cairo'
- hideKeyboard
# The map is centred on the device's Cairo geo fix; tapping it sets the pin.
- tapOn:
    point: '50%,44%'
- tapOn: 'Continue'

# ── Step 5 of 7 — professional details ─────────────────────────────────────
- extendedWaitUntil:
    visible: 'STEP 5 OF 7 — PROFESSIONAL DETAILS'
    timeout: 30000
# Continue is off, and says why, until every required answer is in.
- assertVisible: 'Still needed: .*'
- tapOn: 'Share your experience, approach to childcare, and what makes you a great nanny…'
- inputText: 'E2E lab nanny — five years with toddlers and school-age children.'
- hideKeyboard
- tapOn: 'e.g. 5'
- inputText: '5'
- hideKeyboard
- tapOn: 'Full-time'
- tapOn: '1-3'
- assertNotVisible: 'Still needed: .*'
- tapOn: 'Continue'

# ── Step 6 of 7 — ID upload (a passport: front only) ───────────────────────
- extendedWaitUntil:
    visible: 'STEP 6 OF 7 — VERIFY YOUR IDENTITY'
    timeout: 30000
- tapOn: 'Passport'
# The picker is short-circuited to a bundled placeholder; the card flips to its
# filled state ("Change") once the image is set.
- tapOn: 'Passport photo page'
- extendedWaitUntil:
    visible: 'Change'
    timeout: 30000
# Continue uploads the placeholder to the Storage emulator — reaching Finish
# proves it landed.
- tapOn: 'Continue'

# ── Step 7 of 7 — finish (no referral for a nanny) ─────────────────────────
- extendedWaitUntil:
    visible: 'STEP 7 OF 7 — FINISH'
    timeout: 60000
- tapOn: 'I agree to the Terms of Service and Privacy Policy'
- tapOn: 'Complete setup'

# ── Waiting for vetting ────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: 'Stay in the loop'
    timeout: 90000
- tapOn: 'Not now'
# She registered PENDING_REVIEW, so the root router holds her on the gate rather
# than a dashboard — signed in, but her earnings genuinely out of reach.
- extendedWaitUntil:
    visible: 'Your profile is under review'
    timeout: 60000
- assertNotVisible: 'Your earnings'

# ── Vetted ─────────────────────────────────────────────────────────────────
- runScript:
    file: ../scripts/advance.js
    env:
      ADVANCE: admin-approve-nanny-registration
- assertTrue: ${output.status == 'APPROVED'}

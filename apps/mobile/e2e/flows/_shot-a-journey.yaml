# Branding capture, part A — the parent's core journey.
#
# Not a test: the leading underscore keeps run.mjs from running it, and it
# asserts nothing beyond "the screen arrived", because its output is PNGs
# rather than a pass or a fail. Driven the same way the real flows are so the
# screenshots are of the real app against the real stack, not a mockup.
#
# Signs in through the shared _sign-in.yaml subflow (email + password) — the
# same door every real flow uses now that phone sign-in no longer takes a
# password (see _sign-in.yaml). That subflow owns the Get Started → role
# picker → Welcome back → email-door navigation itself, so this no longer
# captures screenshots of those intermediate screens, only what comes before
# and after sign-in.
#
# Run it through scripts/capture-branding.sh, which passes ${OUT}.
appId: com.nannyapp.mobile
---
- runFlow: _launch.yaml
- takeScreenshot: ${OUT}/01-welcome

- runFlow:
    file: _sign-in.yaml
    env:
      EMAIL: ${MOTHER_EMAIL}

- extendedWaitUntil:
    visible: 'Book care'
    timeout: 60000
- takeScreenshot: ${OUT}/02-home

# ── Booking ────────────────────────────────────────────────────────────────
- tapOn: 'Book care'
- extendedWaitUntil:
    visible: 'Pick a day'
    timeout: 30000
- takeScreenshot: ${OUT}/03-pick-a-day

- tapOn:
    id: 'booking.day'
    index: 0
- takeScreenshot: ${OUT}/04-pick-a-time

- tapOn:
    id: 'booking.cta'
- extendedWaitUntil:
    visible: 'Who needs care?'
    timeout: 30000
- takeScreenshot: ${OUT}/05-care-details

- tapOn:
    id: 'booking.cta'
- extendedWaitUntil:
    visible: 'Review your request'
    timeout: 30000
- takeScreenshot: ${OUT}/06-review

# Deliberately stops here — submitting would leave a second live booking behind
# and change every later screenshot.

# C13 — a nanny signs up with Google, all the way to the vetting gate.
#
# C11 proved the mother side of a Google sign-up (three steps, no email-code or
# password screen); this is the nanny side, which keeps the same fork A10
# proved for the phone wizard — one extra step (professional details) and an
# ID upload before the final one, and PENDING_REVIEW lands her on the vetting
# gate rather than a dashboard. The picker, Step 1's locked/verified email, and
# the final phone-link step are exactly C11's; what's new here is nanny
# location → ID → professional details in between, taken from A10.
#
# The account is created from scratch, so the seeder wipes it (Firebase user +
# DB row) before every run, the same way C11's and A10's throwaway accounts are.
appId: com.nannyapp.mobile
---
- runFlow: _launch.yaml

- tapOn: 'Sign up'
- extendedWaitUntil:
    visible: 'Create your account'
    timeout: 30000

# Google needs a role on this screen; the button is disabled until one is picked.
- tapOn: "I'm a nanny"
- tapOn: 'Continue with Google'

- extendedWaitUntil:
    visible: 'Choose a test Google account'
    timeout: 30000
- tapOn:
    id: 'e2eGooglePicker.email'
- inputText: ${SOCIAL_NANNY_REGISTRATION_EMAIL}
- hideKeyboard
- tapOn: 'Use this Google account'

# ── Step 1 of 5 — Google supplied the name and a verified, fixed email ─────
- extendedWaitUntil:
    visible: 'STEP 1 OF 5.*'
    timeout: 60000
- assertVisible: ${SOCIAL_NANNY_REGISTRATION_EMAIL}
- assertVisible: 'Verified by Google'

- tapOn: 'Add photo'
- extendedWaitUntil:
    visible: 'Change photo'
    timeout: 30000

- tapOn: '100 000 0000'
- inputText: ${SOCIAL_NANNY_REGISTRATION_PHONE}
- hideKeyboard
- scrollUntilVisible:
    element:
      text: 'Select your date of birth'
    direction: DOWN
    timeout: 20000
- tapOn: 'Select your date of birth'
- tapOn: 'OK'
- tapOn: 'Continue'

# ── Nanny location — the map, on the device geo fix ────────────────────────
- extendedWaitUntil:
    visible: 'Where are you based?'
    timeout: 30000
- tapOn:
    point: '50%,44%'
# The lab has no Maps key, so the pin's reverse-geocode never fills the
# address — type it, as A10 does. After the map tap, so a reverse-geocoded
# line can't overwrite it afterwards.
- tapOn: 'Street address'
- inputText: '1 Test Street, Cairo'
- hideKeyboard
- tapOn: 'Continue'

# ── ID upload (a passport: front only) ──────────────────────────────────────
- extendedWaitUntil:
    visible: 'Upload your ID'
    timeout: 30000
- tapOn: 'Passport'
# The picker is short-circuited to a bundled placeholder; the card flips to its
# filled state ("Change") once the image is set.
- tapOn: 'Passport photo page'
- extendedWaitUntil:
    visible: 'Change'
    timeout: 30000
- tapOn: 'Continue'

# ── Professional details — filled minimally, as A10 does ───────────────────
- extendedWaitUntil:
    visible: 'Tell families about yourself'
    timeout: 30000
- tapOn: 'Share your experience, approach to childcare, and what makes you a great nanny…'
- inputText: 'E2E lab nanny — five years with toddlers and school-age children.'
- hideKeyboard
- tapOn: 'e.g. 5'
- inputText: '5'
- hideKeyboard
- tapOn: 'Full-time'
- tapOn: '1-3'
- tapOn: 'Continue'

# ── Final step — the phone is linked onto the Google account ───────────────
- extendedWaitUntil:
    visible: 'Verify your phone number'
    timeout: 30000
- extendedWaitUntil:
    visible: 'Resend in.*'
    timeout: 30000
- runScript:
    file: ../scripts/advance.js
    env:
      ADVANCE: phone-otp
      OTP_PHONE: ${SOCIAL_NANNY_REGISTRATION_PHONE_E164}
- assertTrue: ${output.otp != null}
- tapOn:
    id: 'registerStep3.code.boxes'
- inputText: ${output.otp}
- hideKeyboard
- tapOn: 'I agree to.*'
# Complete uploads the placeholder ID + avatar to the Storage emulator, then
# registers her — so reaching the next screen proves those uploads landed.
- tapOn: 'Complete setup'

# ── Waiting for vetting ────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: 'Stay in the loop'
    timeout: 90000
- tapOn: 'Not now'
# She registered PENDING_REVIEW, so the root router holds her on the gate
# rather than a dashboard — signed in, but her earnings genuinely out of reach.
- extendedWaitUntil:
    visible: 'Your profile is under review'
    timeout: 60000
- assertNotVisible: 'Your earnings'

# UI sweep 16 — the booking chat during a shift, as the mother sees it: the
# entry card on Booking details, the thread with the nanny's message, typing a
# reply with the keyboard open, and the thread after sending. The shift and
# the nanny's message are seeded over HTTP.
appId: com.nannyapp.mobile
---
- runFlow: ../_launch.yaml
- runScript:
    file: ../../scripts/advance.js
    env:
      ADVANCE: mother-book
- runScript:
    file: ../../scripts/advance.js
    env:
      ADVANCE: nanny-accept
- runScript:
    file: ../../scripts/advance.js
    env:
      ADVANCE: mother-pay
- runScript:
    file: ../../scripts/advance.js
    env:
      ADVANCE: nanny-check-in
- runScript:
    file: ../../scripts/advance.js
    env:
      ADVANCE: nanny-chat-message
      CHAT_MESSAGE: 'Hi! We just got back from the park. Is it OK if she has a yogurt before her nap?'
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${MOTHER_EMAIL}
- extendedWaitUntil:
    visible: 'IN PROGRESS: .*is with your child.*'
    timeout: 60000
- tapOn: 'IN PROGRESS: .*is with your child.*'
- extendedWaitUntil:
    visible: 'Booking details'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: 'Message .*'
    direction: DOWN
    centerElement: true
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s16-01-chat-card
- tapOn: 'Message .*'
- extendedWaitUntil:
    visible: '.*yogurt before her nap.*'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s16-02-thread

- tapOn: 'Message'
- waitForAnimationToEnd:
    timeout: 3000
- inputText: 'Yes, a small one is fine. Thank you!'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s16-03-reply-kbd
- tapOn: 'Send message'
- extendedWaitUntil:
    visible: 'Yes, a small one is fine.*'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s16-04-sent-kbd
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s16-05-sent

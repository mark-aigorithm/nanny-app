# UI sweep 21 — the nanny's side of one booking: Booking details before the
# shift, then during it (the on-shift banner's chat button on Dashboard and
# Requests, the care log's, the green live card, the chat and back from it),
# then after ending it. The mother's side (book, pay, chat) is seeded over HTTP.
appId: com.nannyapp.mobile
---
- runFlow: ../_launch.yaml
- runScript:
    file: ../../scripts/advance.js
    env:
      ADVANCE: mother-book
- runScript:
    file: ../../scripts/advance.js
    env:
      ADVANCE: nanny-accept
- runScript:
    file: ../../scripts/advance.js
    env:
      ADVANCE: mother-pay
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${NANNY_EMAIL}

# Before the shift: the booking is confirmed and starts within the hour, so the
# "Shift starting soon" prompt opens first.
- extendedWaitUntil:
    visible: 'Shift starting soon'
    timeout: 60000
- tapOn: 'Not now'
- tapOn: 'Requests'
- tapOn: 'Upcoming'
- runFlow:
    file: _tap.yaml
    env:
      TARGET: 'View details'
- extendedWaitUntil:
    visible: 'Booking details'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s21-01-details-upcoming
- scrollUntilVisible:
    element: 'You earn'
    direction: DOWN
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s21-02-details-upcoming-bottom

# The shift starts, the mother writes twice and the nanny has logged a meal.
- runScript:
    file: ../../scripts/advance.js
    env:
      ADVANCE: nanny-check-in
- runScript:
    file: ../../scripts/advance.js
    env:
      ADVANCE: mother-chat-message
      CHAT_MESSAGE: 'Hi! How is she doing? Did she eat her lunch?'
- runScript:
    file: ../../scripts/advance.js
    env:
      ADVANCE: mother-chat-message
      CHAT_MESSAGE: 'Please bring her back by four for her nap.'
- runScript:
    file: ../../scripts/advance.js
    env:
      ADVANCE: nanny-care-log
      CARE_LOG_NOTE: 'Rice and vegetables, ate most of it'

# Reopened (signed in, state kept) so every screen reads the running shift.
- stopApp
- openLink: 'nanny-app://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081'
- extendedWaitUntil:
    visible: 'Message Mona, 2 unread'
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s21-03-dashboard-banner-chat
- tapOn: 'Requests'
- extendedWaitUntil:
    visible: 'Message Mona, 2 unread'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s21-04-requests-banner-chat

# Care log → chat → back to the care log, read.
- tapOn: 'Open care log.*'
- extendedWaitUntil:
    visible: 'Care log'
    timeout: 30000
- extendedWaitUntil:
    visible: 'Message Mona, 2 unread'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s21-05-care-log-chat
- tapOn: 'Message Mona, 2 unread'
- extendedWaitUntil:
    visible: '.*back by four.*'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s21-06-chat-from-care-log
- back
- extendedWaitUntil:
    visible: 'Log meal|Meal'
    timeout: 30000
- extendedWaitUntil:
    visible: 'Message Mona'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s21-07-care-log-after-chat

# Booking details during the shift.
- back
- tapOn: 'Requests'
- tapOn: 'Upcoming'
- runFlow:
    file: _tap.yaml
    env:
      TARGET: 'View details'
- extendedWaitUntil:
    visible: 'On shift now'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s21-08-details-live
- runFlow:
    file: _tap.yaml
    env:
      TARGET: 'Message Mona.*'
- extendedWaitUntil:
    visible: '.*back by four.*'
    timeout: 30000
- back
# Back keeps the page where it was scrolled to, so wait on the header.
- extendedWaitUntil:
    visible: 'Booking details'
    timeout: 30000
- scrollUntilVisible:
    element: 'On shift now'
    direction: UP
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s21-09-details-after-chat
- scroll
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: s21-10-details-live-scrolled
- scrollUntilVisible:
    element: 'You earn'
    direction: DOWN
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s21-11-details-live-bottom
- scrollUntilVisible:
    element: 'On shift now'
    direction: UP
    timeout: 30000

# Ending the shift from the live card.
- tapOn: 'End shift'
- extendedWaitUntil:
    visible: 'Not now'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: s21-12-end-shift-dialog
- tapOn:
    text: 'End shift'
    index: 1
- extendedWaitUntil:
    visible: 'COMPLETED|Completed'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s21-13-details-completed
- scrollUntilVisible:
    element: 'Rating & review'
    direction: DOWN
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s21-14-details-completed-bottom

# UI sweep 06 — a shift under way, as the mother sees it: Home's live card,
# the booking with its care log, live video, and an extension from request to
# its checkout. Everything up to the check-in is seeded over HTTP.
appId: com.nannyapp.mobile
---
- runFlow: ../_launch.yaml
- runScript:
    file: ../../scripts/advance.js
    env:
      ADVANCE: mother-book
- runScript:
    file: ../../scripts/advance.js
    env:
      ADVANCE: nanny-accept
- runScript:
    file: ../../scripts/advance.js
    env:
      ADVANCE: mother-pay
- runScript:
    file: ../../scripts/advance.js
    env:
      ADVANCE: nanny-check-in
- runScript:
    file: ../../scripts/advance.js
    env:
      ADVANCE: nanny-care-log
      CARE_LOG_NOTE: 'Lunch: pasta and apple slices, ate nearly all of it and asked for more'
- runFlow:
    file: ../_sign-in.yaml
    env:
      EMAIL: ${MOTHER_EMAIL}
- extendedWaitUntil:
    visible: 'IN PROGRESS: .*is with your child.*'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s06-01-home-in-progress
- runFlow: _ai.yaml

- tapOn: 'IN PROGRESS: .*is with your child.*'
- extendedWaitUntil:
    visible: 'Booking details'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s06-02-booking-in-progress
- runFlow: _ai.yaml
- scrollUntilVisible:
    element:
      text: 'Today so far'
    direction: DOWN
    centerElement: true
    timeout: 30000
- takeScreenshot: s06-03-booking-in-progress-care-log
- scroll
- takeScreenshot: s06-04-booking-in-progress-bottom
- scrollUntilVisible:
    element: 'On shift now'
    direction: UP
    timeout: 20000

# "Watch live" shows only for a home with a camera; the lab mother has none.
- runFlow:
    when:
      visible: 'Watch live'
    commands:
      - tapOn: 'Watch live'
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: s06-05-live-video
      - back
      - extendedWaitUntil:
          visible: 'On shift now'
          timeout: 30000

- runFlow:
    file: _tap.yaml
    env:
      TARGET: 'Extend booking'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s06-06-extend-sheet
- runFlow:
    file: _tap.yaml
    env:
      TARGET: '.2 hours'
- takeScreenshot: s06-07-extend-sheet-picked
- runFlow:
    file: _tap.yaml
    env:
      TARGET: 'Send request'
- extendedWaitUntil:
    visible: 'EXTENSION REQUESTED'
    timeout: 30000
- takeScreenshot: s06-08-extension-requested
- runScript:
    file: ../../scripts/advance.js
    env:
      ADVANCE: nanny-accept-extension
- runFlow: ../_open-running-booking.yaml
- extendedWaitUntil:
    visible: 'EXTRA HOURS CONFIRMED'
    timeout: 30000
- takeScreenshot: s06-09-extension-confirmed
- runFlow:
    file: _tap.yaml
    env:
      TARGET: 'Pay now'
- extendedWaitUntil:
    visible: 'Extra hours'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: s06-10-extension-checkout

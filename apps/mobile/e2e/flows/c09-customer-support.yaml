# C9 — help and support: the channels the admin configured, and the FAQ.
#
# The subject is the seam between the console and the app. Support channels are
# `app_settings` rows an operator edits, the app reads them through
# `/support/contact`, and it renders **a card per configured channel and hides
# the rest** — an empty string is how a channel is switched off. So the flow
# configures WhatsApp and email, deliberately blanks the phone number, and
# asserts all three outcomes on screen. Seeding all three would never catch a
# regression that renders a card for a line nobody answers.
#
# The deep links themselves stop at the tap. `Linking.openURL('tel:…')` hands
# off to an app the emulator does not have, and following it would leave the
# flow outside the app under test with nothing to assert.
#
# ── The FAQ is the operators' too ──────────────────────────────────────────
# `configure-support` also writes the FAQ through `PUT /admin/support-faq`,
# with strings that are deliberately not the backend's built-in defaults. So
# the questions asserted below prove the console write reached the screen —
# a default rendering would fail the flow, which is the point.
appId: com.nannyapp.mobile
---
- runFlow: _launch.yaml

- runScript:
    file: ../scripts/advance.js
    env:
      ADVANCE: configure-support
- assertTrue: ${output.phone == ''}

- runFlow:
    file: _sign-in.yaml
    env:
      PHONE: ${MOTHER_PHONE}
- extendedWaitUntil:
    visible: 'Book care'
    timeout: 60000

- tapOn: 'Account'
- extendedWaitUntil:
    visible: 'Help'
    timeout: 30000
- tapOn: 'Help'

- extendedWaitUntil:
    visible: 'Help & support'
    timeout: 30000

# ── The channels ───────────────────────────────────────────────────────────
- assertVisible: 'WhatsApp'
- assertVisible: 'Email support'

# The one that was configured blank. This is the assertion the flow exists for:
# an operator who clears a number expects the card to go, not to dial nothing.
- assertNotVisible: 'Call support'

# Not configurable — it is always offered, because it costs the platform
# nothing to answer.
- assertVisible: 'Ask the community'

# ── The FAQ ────────────────────────────────────────────────────────────────
# The first question is expanded on arrival, so its answer is the assertion
# that the accordion rendered rather than that it opened.
#
# Every question mark is escaped: a Maestro text selector is a full-match
# regex, so a bare `?` makes the preceding letter optional and then fails
# against a node whose text really does end in one.
- extendedWaitUntil:
    visible: 'Is this FAQ written from the console\?'
    timeout: 30000
- assertVisible: 'Yes\. An operator wrote this answer in Settings.*'

- tapOn: 'What is the cancellation policy\?'
- extendedWaitUntil:
    visible: 'Cancel up to 24 hours ahead for a full refund.*'
    timeout: 30000
# Only one panel is open at a time — the accordion closes the last one rather
# than stacking.
- assertNotVisible: 'Yes\. An operator wrote this answer in Settings.*'

# ── Search ─────────────────────────────────────────────────────────────────
- tapOn:
    id: 'customerSupport.search'
- inputText: 'refund'
- hideKeyboard
- extendedWaitUntil:
    visible: 'How long does a refund take\?'
    timeout: 30000
- assertNotVisible: 'Is this FAQ written from the console\?'

# The search reads the answers as well as the questions, which is why the
# cancellation entry survives a query that its question does not contain.
- assertVisible: 'What is the cancellation policy\?'

# ── Out through the community door ─────────────────────────────────────────
- tapOn: 'Ask the community'
- extendedWaitUntil:
    visible: 'Q&A'
    timeout: 30000

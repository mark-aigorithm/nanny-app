# C15 — a leftover resumes instead of dead-ending.
#
# The seeded LEFTOVER account is a Firebase user with a password and a linked
# phone but no `users` row at all — the shape of a phone-first sign-up that
# stopped right after Firebase created the account, before `/auth/register`
# ever ran. Signing in by SMS (the plain phone door) succeeds at Firebase,
# `/auth/me` 404s, and the root gate seeds a draft from the account instead of
# starting fresh or signing her out: role selection opens in "Finish setting
# up your account" mode. The phone is already on the account, so the wizard
# skips "Your number" and counts four steps. Because the account's password
# is already registered under the very email on file, "Secure your account"
# keeps it ("Your password is already set.") once she proves that address
# again.
#
# Nothing here is a throwaway in the C2/A10 sense (this flow never lets
# /auth/register run against the seeded phone/email — it is the same account
# throughout), but the account still can't be upserted like a normal seeded
# one: it must exist in Firebase with no row. The seeder wipes it, then
# recreates it as a Firebase-only user, before every run.
appId: com.nannyapp.mobile
---
- runFlow: _launch.yaml

# ── Sign in by SMS, as any returning phone number would ────────────────────
- tapOn:
    id: 'signIn.phone'
- inputText: ${LEFTOVER_PHONE}
- hideKeyboard
- tapOn: 'Send code'
- extendedWaitUntil:
    visible: "Didn't get a code?"
    timeout: 60000
- runScript:
    file: ../scripts/advance.js
    env:
      ADVANCE: phone-otp
      OTP_PHONE: ${LEFTOVER_PHONE_E164}
- assertTrue: ${output.otp != null}
- tapOn:
    id: 'signIn.code.boxes'
- inputText: ${output.otp}
- hideKeyboard
- tapOn: 'Sign in'

# ── Resumed, not dead-ended: role selection knows she has an account ───────
- extendedWaitUntil:
    visible: 'Finish setting up your account'
    timeout: 30000
- assertVisible: 'Signed in as ${LEFTOVER_EMAIL}. Tell us who you are to finish setting up.'
- tapOn: "I'm a mother"
- tapOn: 'Sign up as a mother'

# ── Step 1 of 4 — about you; no "Your number", the phone is already hers ──
- extendedWaitUntil:
    visible: 'STEP 1 OF 4 — ABOUT YOU'
    timeout: 30000
- assertVisible: ${LEFTOVER_EMAIL}

- tapOn: 'Add photo'
- extendedWaitUntil:
    visible: 'Change photo'
    timeout: 30000

- tapOn: 'Enter your first name'
- inputText: ${LEFTOVER_FIRST_NAME}
- hideKeyboard
- tapOn: 'Enter your last name'
- inputText: 'Lab'
- hideKeyboard
- scrollUntilVisible:
    element:
      text: 'Select your date of birth'
    direction: DOWN
    timeout: 20000
- tapOn: 'Select your date of birth'
- tapOn: 'OK'
- tapOn: 'Continue'

# ── Step 2 of 4 — re-prove the address; the password is kept ───────────────
- extendedWaitUntil:
    visible: 'STEP 2 OF 4 — SECURE YOUR ACCOUNT'
    timeout: 60000
- extendedWaitUntil:
    visible: 'Resend in.*'
    timeout: 30000
- runScript:
    file: ../scripts/advance.js
    env:
      ADVANCE: email-otp
      EMAIL_OTP_ADDRESS: ${LEFTOVER_EMAIL}
- assertTrue: ${output.emailOtp != null}
- tapOn:
    id: 'registerAccount.code.boxes'
- inputText: ${output.emailOtp}
# No hideKeyboard here: the sixth digit starts the check, which disables and
# then replaces the code input, closing the keyboard itself. On Android
# Maestro's hideKeyboard with no keyboard up is a Back press, which pops
# this step back to About you.
- extendedWaitUntil:
    visible: 'Your password is already set.'
    timeout: 30000
- assertNotVisible: 'Enter a password'
- tapOn: 'Continue'

# ── Step 3 of 4 — location ─────────────────────────────────────────────────
- extendedWaitUntil:
    visible: 'STEP 3 OF 4 — LOCATION & PREFERENCES'
    timeout: 30000
- tapOn:
    point: '50%,44%'
- tapOn: 'Street address'
- inputText: '1 Test Street, Cairo'
- hideKeyboard
- tapOn: 'Continue'

# ── Step 4 of 4 — finish, signed in as the number already on the account ──
- extendedWaitUntil:
    visible: 'STEP 4 OF 4 — FINISH'
    timeout: 30000
- assertVisible: 'Signed in as ${LEFTOVER_PHONE_E164}'
- tapOn: 'I agree to the Terms of Service and Privacy Policy'
- tapOn: 'Complete setup'

- extendedWaitUntil:
    visible: 'Stay in the loop'
    timeout: 60000
- tapOn: 'Not now'
- extendedWaitUntil:
    visible: 'Book care'
    timeout: 60000

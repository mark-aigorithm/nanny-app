# Signs in the account whose local phone digits are ${PHONE}.
#
# Not a test — the leading underscore keeps run.mjs from treating it as one.
# Expects `_launch.yaml` to have run: it starts from the welcome screen.
#
# Every control here is selected by visible copy, because on these screens the
# copy is unique and stable. The one exception is the password field; see below.
appId: com.nannyapp.mobile
---
- tapOn: 'Get Started'

- assertVisible: 'Create your account'
- tapOn: 'Sign in'

- assertVisible: 'Welcome back'
- tapOn:
    id: 'signIn.phone'
- inputText: ${PHONE}

# Both fields are named rather than selected by their placeholders: the
# password's is a run of bullet characters, which does not survive the round
# trip through a Windows console into Maestro's regex, and `below: 'Password'`
# is only *usually* the input — it also matches the reveal-password toggle, and
# when it picks that one the password is silently typed into the phone field.
- tapOn:
    id: 'signIn.password'
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: 'Sign in'

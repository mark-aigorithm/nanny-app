# Registers the managed account on its reserved number, through the app.
#
# Not a test on its own: live.mjs runs it once per run, straight after
# POST /e2e-auth/begin and before any flow, and runs no flow if it fails. The
# leading underscore keeps it out of the suite.
#
# The app rather than the Admin SDK, because this is the live proof that
# registration links the real address: "Your number" confirms the phone code —
# a real Firebase sign-in that mints the account — and "Secure your account"
# then links the email/password credential onto that same uid. live-assert-account checks
# exactly that from Firebase's side, which the home screen cannot.
#
# Adapted from ../c02-mother-registration.yaml — the same wizard, steps and
# selectors (with `?` escaped, as C9 found necessary); keep the two in step.
# Three differences:
#   - the phone code is the console's fixed ${MANAGED_CODE}: there is no
#     emulator to read one from (phone-otp reads the Auth emulator);
#   - no referral: C7's step reads the lab mother's code by signing in through
#     the Auth emulator, and she does not exist in the live project;
#   - the gates C2 asserts along the way (the photo hint, the role hint) are
#     C2's subject, not this one's, so they are not repeated here.
# The email code still comes from Mailpit: that OTP is our backend's, and the
# backend's mail stays local in live mode.
appId: com.nannyapp.mobile
---
- runFlow: ../_launch.yaml

- tapOn: 'Sign up'
- extendedWaitUntil:
    visible: 'Create your account'
    timeout: 30000
- tapOn: "I'm a mother"
- assertVisible: 'Sign up as a mother'
- tapOn: 'Sign up as a mother'

# ── Step 1 of 5 — your number ──────────────────────────────────────────────
- extendedWaitUntil:
    visible: 'STEP 1 OF 5 — YOUR NUMBER'
    timeout: 30000
- tapOn: '100 000 0000'
- inputText: ${MANAGED_PHONE}
- hideKeyboard
- tapOn: 'Send code'
# A live Firebase send: the code boxes appear only once it has resolved, so
# they are the signal it went.
- extendedWaitUntil:
    visible:
      id: 'registerPhone.code.boxes'
    timeout: 60000
- tapOn:
    id: 'registerPhone.code.boxes'
- inputText: ${MANAGED_CODE}
- hideKeyboard
- tapOn: 'Verify'

# ── Step 2 of 5 — about you ────────────────────────────────────────────────
- extendedWaitUntil:
    visible: 'STEP 2 OF 5 — ABOUT YOU'
    timeout: 60000

# Under E2E the picker returns a bundled placeholder (lib/e2eImage keys off the
# Storage-emulator host, which e2e:metro:live keeps), so no system UI opens.
- tapOn: 'Add photo'
- extendedWaitUntil:
    visible: 'Change photo'
    timeout: 30000

# hideKeyboard between each field: the keyboard covers the lower half, and a
# tap on a field behind it lands on a key instead.
- tapOn: 'Enter your first name'
- inputText: ${MANAGED_FIRST_NAME}
- hideKeyboard
- tapOn: 'Enter your last name'
- inputText: 'Lab'
- hideKeyboard
# The real address: proved on the next screen and linked there as her
# Firebase password credential.
- tapOn: 'you@example.com'
- inputText: ${MANAGED_EMAIL}
- hideKeyboard

# The native date dialog defaults to 25 years ago — a valid adult DOB — so OK
# is all it needs.
- scrollUntilVisible:
    element:
      text: 'Select your date of birth'
    direction: DOWN
    timeout: 20000
- tapOn: 'Select your date of birth'
- tapOn: 'OK'
- tapOn: 'Continue'

# ── Step 3 of 5 — secure your account (email OTP from Mailpit, password) ───
- extendedWaitUntil:
    visible: 'STEP 3 OF 5 — SECURE YOUR ACCOUNT'
    timeout: 60000
- extendedWaitUntil:
    visible: 'Resend in.*'
    timeout: 30000
- runScript:
    file: ../../scripts/advance.js
    env:
      ADVANCE: email-otp
      EMAIL_OTP_ADDRESS: ${MANAGED_EMAIL}
- assertTrue: ${output.emailOtp != null}
- tapOn:
    id: 'registerAccount.code.boxes'
- inputText: ${output.emailOtp}
- hideKeyboard
- extendedWaitUntil:
    visible: 'Enter a password'
    timeout: 30000
- tapOn: 'Enter a password'
- inputText: ${MANAGED_PASSWORD}
- hideKeyboard
- tapOn: 'Re-enter your password'
- inputText: ${MANAGED_PASSWORD}
- hideKeyboard
- tapOn: 'Continue'

# ── Step 4 of 5 — location & preferences ───────────────────────────────────
- extendedWaitUntil:
    visible: 'STEP 4 OF 5 — LOCATION & PREFERENCES'
    timeout: 30000
# Tapping the map (centred on the device's Cairo geo fix) sets the pin, which
# is the lat/long Continue requires. Same point as C2.
- tapOn:
    point: '50%,44%'
# The street line is required for every account — type it, as A10 does. After
# the map tap, so a reverse-geocoded line can't overwrite it afterwards.
- tapOn: 'Street address'
- inputText: '1 Test Street, Cairo'
- hideKeyboard
- tapOn: 'Background checked'
- tapOn: 'Continue'

# ── Step 5 of 5 — finish ───────────────────────────────────────────────────
- extendedWaitUntil:
    visible: 'STEP 5 OF 5 — FINISH'
    timeout: 30000
- tapOn: 'I agree to the Terms of Service and Privacy Policy'
- tapOn: 'Complete setup'

- extendedWaitUntil:
    visible: 'Stay in the loop'
    timeout: 60000
- tapOn: 'Not now'
- extendedWaitUntil:
    visible: 'Book care'
    timeout: 60000

# ── The part a screen cannot show ──────────────────────────────────────────
# One Firebase user on the reserved number, with her address as a password
# credential beside the phone, and a row behind it.
- runScript:
    file: ../../scripts/advance.js
    env:
      ADVANCE: live-assert-account
      LIVE_PHONE: ${MANAGED_PHONE_E164}
      LIVE_EMAIL: ${MANAGED_EMAIL}
- assertTrue: ${output.firebaseExists == 'true' && output.dbRowExists == 'true'}

# A number nobody registered is told so before any SMS is sent.
#
# The sign-in door asks /auth/phone-account first, so no code goes out and
# Firebase never mints the phone-only account a confirmed code would. (If the
# check fails the app sends the code anyway, and the after-confirm guard
# deletes that stray — the unit tests cover that path.) The assertion that
# matters is the harness one at the end: a stray account is exactly what a
# screen cannot show you.
appId: com.nannyapp.mobile
---
- runFlow: ../_launch.yaml

- assertVisible: 'Welcome to NannyNow'

- tapOn:
    id: 'signIn.phone'
- inputText: ${ABSENT_PHONE}
- hideKeyboard
- tapOn: 'Send code'

# Shown under the phone field straight away — no code screen, no SMS.
- extendedWaitUntil:
    visible: "We couldn't find an account for that number. Sign up first."
    timeout: 30000
- assertNotVisible: "Didn't get a code\\?"
- assertNotVisible: 'Book care'

# Nothing may be left squatting on the number.
- runScript:
    file: ../../scripts/advance.js
    env:
      ADVANCE: live-assert-no-account
      LIVE_PHONE: ${ABSENT_PHONE_E164}
- assertTrue: ${output.firebaseExists == 'false'}

# C1 — getting in, getting out, and the door marked "Forgot password?".
#
# The other flows all begin by signing in and never look at it again, so this is
# the only place the auth screens themselves are the subject: a refused
# password, a session that really ends, and the reset screen.
#
# Two assertions here are deliberately about things a screen cannot show you.
# Signing out is checked by **reopening the app**, because navigating back to
# the welcome screen would look identical whether or not Firebase's persisted
# session was actually cleared. And the reset is checked against the Auth
# emulator's own out-of-band code list, because "Check your inbox" is client
# state the screen sets on any success the SDK reports.
#
# ── KNOWN GAP, pinned below ────────────────────────────────────────────────
# The reset screen asks for an email address that no user of this app has.
# Sign-up is phone-only: RegistrationStep3Screen derives a placeholder email
# from the phone number (`phoneToPlaceholderEmail`) and that synthesized string
# is the Firebase credential *and* the address stored on the user row. A real
# person is never shown it and has no reason to guess it, so whatever they type
# is refused. This flow asserts both halves — the refusal a real user gets, and
# the success that is only reachable with the placeholder — so that closing the
# gap (collecting a real email, or making this screen take a phone number) turns
# the first assertion red rather than passing silently.
appId: com.nannyapp.mobile
---
- runFlow: _launch.yaml

# ── A wrong password is refused, and on the right field ────────────────────
- tapOn: 'Get Started'
- assertVisible: 'Create your account'
- tapOn: 'Sign in'
- assertVisible: 'Welcome back'

- tapOn:
    id: 'signIn.phone'
- inputText: ${MOTHER_PHONE}
# Shaped like a real password on purpose. `validatePassword` runs first and
# rejects anything without eight characters, an uppercase letter and a digit —
# so an obviously-junk string never reaches Firebase, and this would assert the
# client-side rule while believing it had tested the server's answer.
- tapOn:
    id: 'signIn.password'
- inputText: 'Wrongpass9'
- hideKeyboard
- tapOn: 'Sign in'

# The copy is deliberately vague about *which* half was wrong — asserting it
# verbatim is what would catch a well-meaning edit that starts telling an
# attacker the phone number exists.
- extendedWaitUntil:
    visible: 'Incorrect phone number or password.'
    timeout: 30000
- assertNotVisible: 'Book care'

# ── The right one gets her in ──────────────────────────────────────────────
- runFlow: _launch.yaml
- runFlow:
    file: _sign-in.yaml
    env:
      PHONE: ${MOTHER_PHONE}
- extendedWaitUntil:
    visible: 'Book care'
    timeout: 60000

# ── And out again ──────────────────────────────────────────────────────────
- tapOn: 'Account'
- extendedWaitUntil:
    visible: 'Sign out'
    timeout: 30000
- tapOn: 'Sign out'
- extendedWaitUntil:
    visible: 'Care you can trust'
    timeout: 30000

# The assertion that matters: reopening lands on the welcome screen, so the
# stored session is gone rather than merely navigated away from. Firebase
# restores a session on launch, so a sign-out that only changed the route would
# put her straight back on the home screen here.
- runFlow:
    file: _relaunch.yaml
    env:
      EXPECT: 'Care you can trust'
- assertNotVisible: 'Book care'

# ── Forgot password ────────────────────────────────────────────────────────
- tapOn: 'Get Started'
- assertVisible: 'Create your account'
- tapOn: 'Sign in'
- assertVisible: 'Welcome back'
- tapOn: 'Forgot password?'
- extendedWaitUntil:
    visible: 'Reset your password'
    timeout: 30000

# KNOWN GAP: what a real person would type. Registration never asked for this
# address, so Firebase has never heard of it and the screen says so. Asserted
# rather than skipped, so the gap is visible in a run instead of only in a doc.
- tapOn:
    id: 'forgotPassword.email'
- inputText: 'mona@example.com'
- hideKeyboard
- tapOn: 'Send reset link'
- extendedWaitUntil:
    visible: "We couldn't find an account with those details."
    timeout: 30000
- assertNotVisible: 'Check your inbox'

# The address that does work — the one the app synthesized for her and never
# showed her. Counted before the tap because the emulator's code list is never
# cleared: a run an hour ago left one behind for this same account, so "a code
# exists" would pass without the app doing anything at all.
- runScript:
    file: ../scripts/advance.js
    env:
      ADVANCE: reset-codes-before

- tapOn:
    id: 'forgotPassword.email'
- eraseText
- inputText: ${MOTHER_EMAIL}
- hideKeyboard
- tapOn: 'Send reset link'

- extendedWaitUntil:
    visible: 'Check your inbox'
    timeout: 30000

- runScript:
    file: ../scripts/advance.js
    env:
      ADVANCE: reset-code-issued
- assertTrue: ${output.resetCodeIssued == 'true'}

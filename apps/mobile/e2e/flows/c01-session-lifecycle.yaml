# C1 — getting in, getting out, and the door marked "Forgot password?".
#
# The other flows all begin by signing in and never look at it again, so this is
# the only place the auth screens themselves are the subject: a refused
# password, a session that really ends, and the phone-based reset.
#
# Two assertions here are deliberately about things a screen cannot show you.
# Signing out is checked by **reopening the app**, because navigating back to
# the welcome screen would look identical whether or not Firebase's persisted
# session was actually cleared. And the reset is proven by *signing in with the
# new password afterwards* — "landing back in the app" is client state the SDK
# reports on any success, so only the next sign-in shows that the credential the
# app actually checks was changed.
#
# Recovery is by phone because sign-in is: the screen texts a code to the
# number, confirming it signs her in as her phone uid, and updatePassword writes
# the new password onto the email/password credential SignInScreen checks. Those
# are one Firebase account — the seeder links the phone number onto the mother's
# uid exactly as real registration does (useConfirmPhoneAndLink), so the
# emulator's phone sign-in resolves to her, not a second user. The code never
# arrives as SMS; the emulator parks it on an admin endpoint advance.js reads.
appId: com.nannyapp.mobile
---
- runFlow: _launch.yaml

# ── A wrong password is refused, and on the right field ────────────────────
- tapOn: 'Get Started'
- assertVisible: 'Create your account'
- tapOn: 'Sign in'
- assertVisible: 'Welcome back'

- tapOn:
    id: 'signIn.phone'
- inputText: ${MOTHER_PHONE}
# Shaped like a real password on purpose. `validatePassword` runs first and
# rejects anything without eight characters, an uppercase letter and a digit —
# so an obviously-junk string never reaches Firebase, and this would assert the
# client-side rule while believing it had tested the server's answer.
- tapOn:
    id: 'signIn.password'
- inputText: 'Wrongpass9'
- hideKeyboard
- tapOn: 'Sign in'

# The copy is deliberately vague about *which* half was wrong — asserting it
# verbatim is what would catch a well-meaning edit that starts telling an
# attacker the phone number exists.
- extendedWaitUntil:
    visible: 'Incorrect phone number or password.'
    timeout: 30000
- assertNotVisible: 'Book care'

# ── The right one gets her in ──────────────────────────────────────────────
- runFlow: _launch.yaml
- runFlow:
    file: _sign-in.yaml
    env:
      PHONE: ${MOTHER_PHONE}
- extendedWaitUntil:
    visible: 'Book care'
    timeout: 60000

# ── And out again ──────────────────────────────────────────────────────────
- tapOn: 'Account'
- extendedWaitUntil:
    visible: 'Sign out'
    timeout: 30000
- tapOn: 'Sign out'
- extendedWaitUntil:
    visible: 'Care you can trust'
    timeout: 30000

# The assertion that matters: reopening lands on the welcome screen, so the
# stored session is gone rather than merely navigated away from. Firebase
# restores a session on launch, so a sign-out that only changed the route would
# put her straight back on the home screen here.
- runFlow:
    file: _relaunch.yaml
    env:
      EXPECT: 'Care you can trust'
- assertNotVisible: 'Book care'

# ── Forgot password — the phone-based reset ────────────────────────────────
- tapOn: 'Get Started'
- assertVisible: 'Create your account'
- tapOn: 'Sign in'
- assertVisible: 'Welcome back'
- tapOn: 'Forgot password?'
- extendedWaitUntil:
    visible: 'Reset your password'
    timeout: 30000

# ── Phase 1: her number ────────────────────────────────────────────────────
- tapOn:
    id: 'forgotPassword.phone'
- inputText: ${MOTHER_PHONE}
- hideKeyboard
- tapOn: 'Send code'

# The verify phase reuses the 'Reset your password' headline, so wait for
# something only it renders — the new-password field.
- extendedWaitUntil:
    visible: 'New password'
    timeout: 30000

# ── The code, read straight off the emulator (no SMS is ever sent) ─────────
# Keyed by the E.164 the app dialled — the country code plus her digits, not
# the digits she typed. phoneOtp throws if none was issued, so reaching the
# next step is itself proof the send worked.
- runScript:
    file: ../scripts/advance.js
    env:
      ADVANCE: phone-otp
      OTP_PHONE: ${MOTHER_PHONE_E164}
- assertTrue: ${output.otp != null}

# ── Phase 2: type the code and choose a new password ───────────────────────
# The boxes are a drawing of one offscreen 1×1 input Android prunes from the
# tree — so tap the visible boxes (`.boxes`) to focus it, then type the code.
- tapOn:
    id: 'forgotPassword.code.boxes'
- inputText: ${output.otp}
- hideKeyboard
# The password fields have no testID — selected by their placeholder copy,
# which is unique here (unlike the bullet-run on the sign-in screen) and never
# matches the reveal-password toggle.
- tapOn: 'Enter a new password'
- inputText: 'NewPassw0rd!'
- hideKeyboard
- tapOn: 'Re-enter your password'
- inputText: 'NewPassw0rd!'
- hideKeyboard
- tapOn: 'Reset password'

# The reset signs her in and drops her on Home — but that is the weak half of
# the proof (the SDK reports success either way). The strong half is below.
- extendedWaitUntil:
    visible: 'Book care'
    timeout: 60000

# ── The new password is the real one now ───────────────────────────────────
# Sign out and back in with it. This is the assertion that matters: it fails if
# updatePassword touched some other account (a phone-only user the emulator
# minted because the number was not linked to hers) rather than the credential
# SignInScreen checks.
- tapOn: 'Account'
- extendedWaitUntil:
    visible: 'Sign out'
    timeout: 30000
- tapOn: 'Sign out'
- extendedWaitUntil:
    visible: 'Care you can trust'
    timeout: 30000

- runFlow:
    file: _sign-in.yaml
    env:
      PHONE: ${MOTHER_PHONE}
      PASSWORD: 'NewPassw0rd!'
- extendedWaitUntil:
    visible: 'Book care'
    timeout: 60000

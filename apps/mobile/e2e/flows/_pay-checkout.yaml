# Pays the hosted checkout that is open in the app's WebView, with the
# approved test card.
#
# Not a test — the leading underscore keeps run.mjs from treating it as one.
# This is the one place a flow touches the checkout page, and it is the same
# against the Paymob fake and Paymob's TEST-mode sandbox (run.mjs
# --paymob=sandbox): both show a card form described in
# test-support/paymob/checkout.json, and on both the card typed decides the
# outcome. run.mjs passes those values and the card in as CHECKOUT_* and CARD_*.
#
# Paymob's card fields have no visible labels, so each is found by its
# placeholder, which Android's WebView exposes as the field's hint text.
appId: com.nannyapp.mobile
---
- extendedWaitUntil:
    visible: ${CHECKOUT_CARD_NUMBER_LABEL}
    timeout: 60000

# Each field is tapped, cleared, typed into, and the keyboard closed again.
# Closing it matters: where the checkout sits below the app's own header (the
# adjustment screen), the open keyboard covers the next field. The tap then
# lands on the keyboard, focus stays put, and the next value overwrites the
# last field. Clearing first means a field the WebView has filled in already
# is replaced rather than appended to.
- tapOn: ${CHECKOUT_CARD_NUMBER_LABEL}
- eraseText
- inputText: ${CARD_NUMBER}
- hideKeyboard
- tapOn: ${CHECKOUT_EXPIRY_LABEL}
- eraseText
- inputText: ${CARD_EXPIRY}
- hideKeyboard
- tapOn: ${CHECKOUT_CVV_LABEL}
- eraseText
- inputText: ${CARD_CVV}
- hideKeyboard
- tapOn: ${CHECKOUT_NAME_LABEL}
- eraseText
- inputText: ${CARD_NAME}
- hideKeyboard
- tapOn: ${CHECKOUT_PAY_LABEL}

# Paymob's test cards pass 3-D Secure without a challenge, so there is
# nothing to answer: the page confirms, says "Thanks for your payment", and
# redirects to the app's return URL on its own.
#
# Done only when the checkout has handed back to the app. A flow that
# relaunched the app before that would kill the payment in flight, and A07 and
# A08 relaunch next. Three waits, because no one signal is enough on its own:
#
#   1. The Pay button goes: the card was submitted. On the sandbox the redirect
#      follows some 25 seconds later, so this alone is far too early.
#   2. "Thanks for your payment" shows. Optional, because Paymob sometimes
#      redirects before Maestro reads it. When it is missed, the 90 seconds
#      spent waiting are longer than any payment takes, so the checkout has
#      handed back by the time the wait gives up.
#   3. "Thanks for your payment" goes: the redirect. Paymob's "in 5 seconds"
#      has been seen sitting on 5 for over 30.
#
# Not the "Secure payment" header that heads every state of Paymob's page:
# where the checkout sits below the app's own header (A07, A08), the typed
# fields scroll it off screen, and it reads as gone while the payment is still
# running.
- extendedWaitUntil:
    notVisible: ${CHECKOUT_PAY_LABEL}
    timeout: 30000
- extendedWaitUntil:
    visible: ${CHECKOUT_PAID_LABEL}
    timeout: 90000
    optional: true
- extendedWaitUntil:
    notVisible: ${CHECKOUT_PAID_LABEL}
    timeout: 90000
